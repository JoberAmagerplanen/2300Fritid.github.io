<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2300 Fritid - Forside</title>
    <link rel="stylesheet" href="style/header.css">
    <link rel="stylesheet" href="style/map.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="billeder/2300 fritid logo.png" alt="2300 Fritid Logo">
            </div>
            <nav class="navigation">
                <ul class="nav-list">
                    <li><a href="index.html" class="nav-link active">Forside</a></li>
                    <li><a href="liste.html" class="nav-link">Liste over aktiviteter</a></li>
                    <li><a href="kontakt.html" class="nav-link">Kontakt os</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <a href="https://www.instagram.com/amagerplanen/" target="_blank" rel="noopener noreferrer" class="icon-link instagram-icon" aria-label="Følg os på Instagram">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="2"/>
                        <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/>
                        <circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/>
                    </svg>
                </a>
                <a href="https://amagerplanen.dk/" target="_blank" rel="noopener noreferrer" class="icon-link org-logo-link" aria-label="Besøg Amagerplanens hjemmeside">
                    <img src="billeder/Logo Amagerplanen uden tekst_lille.png" alt="Amagerplanen Logo">
                </a>
            </div>
        </div>
    </header>
    <!-- Main Content -->
    <main>
        <section class="hero">
            <h1>Find aktiviteter tæt på dig</h1>
            <p>Klik på kortet og se, hvad der foregår i dit område</p>

        </section>
        <!-- Filter Buttons -->
        <div id="filter-buttons"></div>
        <!-- Map Container with Image -->
        <div id="map-container">
            <img id="map-image" src="billeder/Kort med navne.png" alt="Kort over Amagerplanen">
        </div>
    </main>
    <!-- Load data and scripts -->
    <script src="data/activities.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
